name: Xbox UWP package

# launcher - "NCAA 10 PSP" start screen without the game code (no game data).
#            Built on every push; finds your game file but cannot play it.
# smoke    - game-free test package (synthetic PSP program).
# ncaa10   - "NCAA 10 PSP Game" from YOUR files. Only runs in a PRIVATE
#            repository: attach your game file (.chd, .cso or .iso), your
#            decrypted EBOOT.BIN and optionally cover.png to a release tagged
#            "game-input" (loose or in .zip files). See docs/XBOX.md.

on:
  push:
    branches: [main]
    paths:
      - 'uwp/**'
      - 'profile/**'
      - 'patches/**'
      - 'scripts/build_uwp.ps1'
      - 'scripts/setup.sh'
      - 'scripts/build_tools.sh'
      - '.github/workflows/uwp.yml'
  workflow_dispatch:
    inputs:
      game:
        description: 'launcher (no game code), smoke (test) or ncaa10 (private repo + game-input release)'
        type: choice
        options: [launcher, smoke, ncaa10]
        default: launcher
      opt:
        description: 'Optimization level for the generated game code (0-3)'
        default: '1'
      pack_disc:
        description: 'ncaa10: put your game file (.chd/.cso/.iso as uploaded) in the package'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  disc-image:
    # The console reads ISO / CSO / CHD in place; check uwp/disc_image.cpp
    # against real libchdr and chdman output (synthetic disc, no game data).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mame-tools
          pip install --quiet pycdlib
      - name: Build libchdr and the disc image test
        run: |
          commit=$(grep -oP 'LibchdrCommit = "\K[0-9a-f]+' scripts/build_uwp.ps1)
          git clone --quiet https://github.com/rtissera/libchdr.git build/libchdr
          git -C build/libchdr checkout --quiet "$commit"
          cmake -S build/libchdr -B build/libchdr-build -DBUILD_SHARED_LIBS=OFF -DCHDR_WANT_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/libchdr-build --target chdr-static miniz -j 4
          g++ -std=c++20 -O1 -g -Wall -Wextra -fsanitize=address,undefined -Iuwp -Ibuild/libchdr/include \
            -Ibuild/libchdr/deps/miniz-3.1.2 -DMINIZ_NO_ARCHIVE_APIS -DMINIZ_NO_DEFLATE_APIS -DMINIZ_NO_STDIO -DMINIZ_NO_TIME \
            uwp/tests/disc_image_test.cpp uwp/disc_image.cpp \
            -Wl,--start-group $(find build/libchdr-build -name '*.a') -Wl,--end-group -o build/disc_image_test
      - name: ISO, CSO and CHD read back byte-identical
        run: |
          python uwp/tests/make_test_disc.py build/disc
          chdman createdvd -i build/disc/test.iso -o build/disc/dvd.chd
          chdman createdvd -i build/disc/test.iso -o build/disc/dvd2048.chd -hs 2048
          chdman createcd -i build/disc/test.iso -o build/disc/cd.chd
          build/disc_image_test build/disc/test.iso build/disc/test.iso build/disc/test.cso \
            build/disc/dvd.chd build/disc/dvd2048.chd build/disc/cd.chd
      - name: CHD and CSO convert back to the exact ISO (build input path)
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -Iuwp -Ibuild/libchdr/include -Ibuild/libchdr/deps/miniz-3.1.2 \
            -DMINIZ_NO_ARCHIVE_APIS -DMINIZ_NO_DEFLATE_APIS -DMINIZ_NO_STDIO -DMINIZ_NO_TIME \
            uwp/disc_to_iso.cpp uwp/disc_image.cpp \
            -Wl,--start-group $(find build/libchdr-build -name '*.a') -Wl,--end-group -o build/disc_to_iso
          for image in dvd.chd dvd2048.chd cd.chd test.cso; do
            build/disc_to_iso "build/disc/$image" build/disc/out.iso
            cmp build/disc/out.iso build/disc/test.iso && echo "$image -> identical ISO"
          done

  game-input:
    # ncaa10 only: gathers your files from the private game-input release and,
    # for a .chd or .cso, writes the ISO the build steps need with the same
    # reader the console uses. Handed to the Windows job as a short-lived
    # artifact of this private repository.
    if: (inputs.game || 'launcher') == 'ncaa10'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse game builds in a public repository
        if: github.event.repository.private != true
        run: |
          echo "::error::The ncaa10 package contains code translated from your game. Make this repository private before building it here."
          exit 1
      - uses: actions/checkout@v4
      - name: Fetch your files from the game-input release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/input build/game
          gh release download game-input --repo "${{ github.repository }}" --dir build/input
          for zip in build/input/*.zip; do [ -e "$zip" ] && unzip -o -q "$zip" -d build/input && rm "$zip"; done
          find build/input -type f -printf '%s\t%P\n'
          image=$(find build/input -type f \( -iname '*.chd' -o -iname '*.cso' -o -iname '*.iso' \) | head -n 1)
          eboot=$(find build/input -type f -iname 'EBOOT.BIN' | head -n 1)
          cover=$(find build/input -type f \( -iname 'cover.png' -o -iname 'cover.jpg' \) | head -n 1)
          [ -n "$image" ] || { echo "::error::Attach your NCAA Football 10 game file (.chd, .cso or .iso) to the game-input release."; exit 1; }
          [ -n "$eboot" ] || { echo "::error::Attach your decrypted EBOOT.BIN (PPSSPP: Settings > Tools > Developer tools) to the game-input release."; exit 1; }
          mv "$image" "build/game/$(basename "$image")"
          mv "$eboot" build/game/EBOOT.BIN
          [ -n "$cover" ] && mv "$cover" "build/game/cover.${cover##*.}"
          echo "IMAGE=build/game/$(basename "$image")" >> "$GITHUB_ENV"
      - name: CHD / CSO to ISO for the build
        run: |
          case "${IMAGE,,}" in
            *.iso) ln "$IMAGE" build/game/ncaa10.iso 2>/dev/null || cp "$IMAGE" build/game/ncaa10.iso; exit 0 ;;
          esac
          commit=$(grep -oP 'LibchdrCommit = "\K[0-9a-f]+' scripts/build_uwp.ps1)
          git clone --quiet https://github.com/rtissera/libchdr.git build/libchdr
          git -C build/libchdr checkout --quiet "$commit"
          cmake -S build/libchdr -B build/libchdr-build -DBUILD_SHARED_LIBS=OFF -DCHDR_WANT_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/libchdr-build --target chdr-static miniz -j 4
          g++ -std=c++20 -O2 -Iuwp -Ibuild/libchdr/include -Ibuild/libchdr/deps/miniz-3.1.2 \
            -DMINIZ_NO_ARCHIVE_APIS -DMINIZ_NO_DEFLATE_APIS -DMINIZ_NO_STDIO -DMINIZ_NO_TIME \
            uwp/disc_to_iso.cpp uwp/disc_image.cpp \
            -Wl,--start-group $(find build/libchdr-build -name '*.a') -Wl,--end-group -o build/disc_to_iso
          build/disc_to_iso "$IMAGE" build/game/ncaa10.iso
      - uses: actions/upload-artifact@v4
        with:
          name: ncaa10-game-input
          path: build/game/
          retention-days: 1
          compression-level: 0

  uwp:
    needs: [game-input]
    # Runs for every package; game-input is skipped unless building ncaa10.
    if: ${{ !cancelled() && (needs.game-input.result == 'success' || needs.game-input.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      GAME: ${{ inputs.game || 'launcher' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/download-artifact@v4
        if: env.GAME == 'ncaa10'
        with:
          name: ncaa10-game-input
          path: build/game

      - name: Your game files
        if: env.GAME == 'ncaa10'
        shell: pwsh
        run: |
          $image = Get-ChildItem build/game -File | Where-Object { $_.Extension -in '.chd', '.cso', '.iso' -and $_.Name -ne 'ncaa10.iso' } | Select-Object -First 1
          if (-not $image) { $image = Get-Item build/game/ncaa10.iso }
          "ISO=$((Get-Item build/game/ncaa10.iso).FullName)" | Out-File -Append $env:GITHUB_ENV
          "EBOOT=$((Get-Item build/game/EBOOT.BIN).FullName)" | Out-File -Append $env:GITHUB_ENV
          "PACK_IMAGE=$($image.FullName)" | Out-File -Append $env:GITHUB_ENV
          $cover = Get-ChildItem build/game -Include cover.png, cover.jpg -Recurse | Select-Object -First 1
          if ($cover) { "COVER=$($cover.FullName)" | Out-File -Append $env:GITHUB_ENV }

      - name: Fetch your cover (private release asset, any package)
        # A cover.png attached to the game-input release is used for the tiles
        # and start screen of every package, the game-free one included. Box
        # art stays private: this only runs in a private repository.
        if: github.event.repository.private == true && env.COVER == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/cover | Out-Null
          gh release download game-input --repo "${{ github.repository }}" --pattern 'cover.*' --dir build/cover 2>$null
          $cover = Get-ChildItem build/cover -Include cover.png, cover.jpg -Recurse | Select-Object -First 1
          if ($cover) { "COVER=$($cover.FullName)" | Out-File -Append $env:GITHUB_ENV } else { Write-Host "no cover.png in the game-input release; using the generic icons" }
          exit 0

      - name: Build and package
        shell: pwsh
        run: |
          $extra = @()
          if ($env:COVER) { $extra += @('-Cover', $env:COVER) }
          if ($env:GAME -eq 'ncaa10') {
            $extra += @('-Iso', $env:ISO, '-Eboot', $env:EBOOT)
            if ('${{ inputs.pack_disc }}' -ne 'false') { $extra += @('-PackImage', $env:PACK_IMAGE) }
          }
          ./scripts/build_uwp.ps1 -Game $env:GAME -Opt ${{ inputs.opt || '1' }} -Version "1.0.${{ github.run_number }}.0" @extra

      - uses: actions/upload-artifact@v4
        with:
          name: xbox-uwp-${{ env.GAME }}
          path: build/uwp-${{ env.GAME }}/package/
          retention-days: 7
          compression-level: 0
