name: Xbox UWP package

# smoke  - game-free package (synthetic PSP program). Runs on every push and
#          proves the UWP toolchain, packaging, signing and Xbox install path.
# ncaa10 - NCAA Football 10 from YOUR files. Only runs in a PRIVATE repository:
#          upload ncaa10-input.zip (your .iso + decrypted EBOOT.BIN) to a
#          release tagged "game-input" first. See docs/XBOX.md.

on:
  push:
    branches: [main]
    paths:
      - 'uwp/**'
      - 'profile/**'
      - 'patches/**'
      - 'scripts/build_uwp.ps1'
      - 'scripts/setup.sh'
      - 'scripts/build_tools.sh'
      - '.github/workflows/uwp.yml'
  workflow_dispatch:
    inputs:
      game:
        description: 'smoke (no game data) or ncaa10 (private repo + game-input release)'
        type: choice
        options: [smoke, ncaa10]
        default: smoke
      opt:
        description: 'Optimization level for the generated game code (0-3)'
        default: '1'
      pack_disc:
        description: 'Put the disc in the package (about 2 GB) instead of importing the ISO on the console'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  disc-image:
    # The console reads ISO / CSO / CHD in place; check uwp/disc_image.cpp
    # against real libchdr and chdman output (synthetic disc, no game data).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mame-tools
          pip install --quiet pycdlib
      - name: Build libchdr and the disc image test
        run: |
          commit=$(grep -oP 'LibchdrCommit = "\K[0-9a-f]+' scripts/build_uwp.ps1)
          git clone --quiet https://github.com/rtissera/libchdr.git build/libchdr
          git -C build/libchdr checkout --quiet "$commit"
          cmake -S build/libchdr -B build/libchdr-build -DBUILD_SHARED_LIBS=OFF -DCHDR_WANT_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/libchdr-build --target chdr-static miniz -j 4
          g++ -std=c++20 -O1 -g -Wall -Wextra -fsanitize=address,undefined -Iuwp -Ibuild/libchdr/include \
            -Ibuild/libchdr/deps/miniz-3.1.2 -DMINIZ_NO_ARCHIVE_APIS -DMINIZ_NO_DEFLATE_APIS -DMINIZ_NO_STDIO -DMINIZ_NO_TIME \
            uwp/tests/disc_image_test.cpp uwp/disc_image.cpp \
            -Wl,--start-group $(find build/libchdr-build -name '*.a') -Wl,--end-group -o build/disc_image_test
      - name: ISO, CSO and CHD read back byte-identical
        run: |
          python uwp/tests/make_test_disc.py build/disc
          chdman createdvd -i build/disc/test.iso -o build/disc/dvd.chd
          chdman createdvd -i build/disc/test.iso -o build/disc/dvd2048.chd -hs 2048
          chdman createcd -i build/disc/test.iso -o build/disc/cd.chd
          build/disc_image_test build/disc/test.iso build/disc/test.iso build/disc/test.cso \
            build/disc/dvd.chd build/disc/dvd2048.chd build/disc/cd.chd

  uwp:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      GAME: ${{ inputs.game || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Refuse game builds in a public repository
        if: env.GAME == 'ncaa10' && github.event.repository.private != true
        shell: pwsh
        run: |
          Write-Host "::error::The ncaa10 package contains code translated from your game and your disc files. Make this repository private before building it here."
          exit 1

      - name: Fetch your game input (private release asset)
        if: env.GAME == 'ncaa10'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/input | Out-Null
          gh release download game-input --repo "${{ github.repository }}" --pattern 'ncaa10-input.zip' --dir build/input
          Expand-Archive build/input/ncaa10-input.zip -DestinationPath build/input -Force
          $iso = Get-ChildItem build/input -Recurse -Filter *.iso | Select-Object -First 1
          $eboot = Get-ChildItem build/input -Recurse -Filter EBOOT.BIN | Select-Object -First 1
          if (-not $iso) { throw "ncaa10-input.zip must contain your NCAA Football 10 .iso" }
          "ISO=$($iso.FullName)" | Out-File -Append $env:GITHUB_ENV
          if ($eboot) { "EBOOT=$($eboot.FullName)" | Out-File -Append $env:GITHUB_ENV }
          $cover = Get-ChildItem build/input -Recurse -Include cover.png, cover.jpg | Select-Object -First 1
          if ($cover) { "COVER=$($cover.FullName)" | Out-File -Append $env:GITHUB_ENV }
          Remove-Item build/input/ncaa10-input.zip

      - name: Fetch your cover (private release asset, any package)
        # A cover.png attached to the game-input release is used for the tiles
        # and start screen of every package, the game-free one included. Box
        # art stays private: this only runs in a private repository.
        if: github.event.repository.private == true && env.COVER == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/cover | Out-Null
          gh release download game-input --repo "${{ github.repository }}" --pattern 'cover.*' --dir build/cover 2>$null
          $cover = Get-ChildItem build/cover -Include cover.png, cover.jpg -Recurse | Select-Object -First 1
          if ($cover) { "COVER=$($cover.FullName)" | Out-File -Append $env:GITHUB_ENV } else { Write-Host "no cover.png in the game-input release; using the generic icons" }
          exit 0

      - name: Build and package
        shell: pwsh
        run: |
          $extra = @()
          if ($env:COVER) { $extra += @('-Cover', $env:COVER) }
          if ($env:GAME -eq 'ncaa10') {
            $extra += @('-Iso', $env:ISO)
            if ($env:EBOOT) { $extra += @('-Eboot', $env:EBOOT) }
            if ('${{ inputs.pack_disc }}' -eq 'true') { $extra += '-PackDisc' }
          }
          ./scripts/build_uwp.ps1 -Game $env:GAME -Opt ${{ inputs.opt || '1' }} -Version "1.0.${{ github.run_number }}.0" @extra

      - uses: actions/upload-artifact@v4
        with:
          name: xbox-uwp-${{ env.GAME }}
          path: build/uwp-${{ env.GAME }}/package/
          retention-days: 7
          compression-level: 0
